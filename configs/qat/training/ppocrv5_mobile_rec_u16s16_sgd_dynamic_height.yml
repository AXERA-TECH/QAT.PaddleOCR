name: ppocrv5-mobile-rec-u16s16-attn-s16-qat-sgd-dynamic-height
task: rec
model_name: PP-OCRv5_mobile_rec
qat: true
qat_config: ../ppocrv5_mobile_rec_u16s16_attn_s16.json
training:
  epochs: 50
  batch_size: 64
  workers: 8
  optimizer: SGD
  momentum: 0.9
  learning_rate: 0.000015
  weight_decay: 0.00003
  ctc_fc_weight_decay: 0.00001
  lab_lr_multiplier: 0.1
  image_shape: [3, 48, 320]
  dynamic_heights: [32, 48, 64]
  augmentation: none
  multi_scale_training: true
  amp: false
  reparameterize: true
  rec_graph: pretrained_train
  rec_ctc_backbone_grad: false
  seed: 20260806
  warmup_epochs: 0
  lr_final_factor: 0.1
  observer_freeze_epoch: null
  float_accuracy_baseline: 0.5936446798266731
  epoch2_max_accuracy_drop: 0.10
  save_every: 1
