Global:
  model_name: PP-OCRv5_server_rec
  character_dict_path: pytorchocr/utils/dict/ppocrv5_dict.txt
  use_space_char: true
  d2s_train_image_shape: [3, 48, 320]
Architecture:
  model_type: rec
  algorithm: SVTR_HGNet
  Transform: null
  Backbone:
    name: PPHGNetV2_B4
    text_rec: true
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: true
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: 25
Metric:
  name: RecMetric
  main_indicator: acc
